# Build the APP image locally on top of the published TeX base (~3-5 minutes).
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# Still pulls the TeX base from GHCR. Sticky for maintainers:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.build.yml
services:
  overbranch:
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Keep in step with docker/texlive-base.lock (CI asserts they agree).
        TEX_BASE: ${TEX_BASE:-ghcr.io/overbranch/overbranch-texlive:2026}
